{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión</title>

    <link rel="stylesheet" href="{% static 'css/compartido/variables.css' %}">
    <link rel="stylesheet" href="{% static 'css/compartido/login.css' %}">

    <link rel="stylesheet"  href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

    <main class="login-container">

        <section class="login-card">

            <div class="login-header">
                <h1>HigieneSmart</h1>
                <p>Gestión inteligente de limpieza bajo demanda</p>
            </div>

            <form class="login-form" method="POST" novalidate>
                {% csrf_token %}

                <div class="form-group">
                    <label for="email">Correo electrónico</label>

                    <input type="email" id="email" name="email" placeholder="correo@ejemplo.cl" required >

                    <p id="email-error" class="form-error"></p>
                </div>

                <div class="form-group">
                    <label for="password">Contraseñas</label>

                    <div class="password-container">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Ingresa tu contraseña"
                            maxlength="128"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            id="toggle-password"
                            class="toggle-password"
                            aria-label="Mostrar contraseña"
                        >
                            <i id="icon-eye-closed" class="bi bi-eye-slash"></i> 
                            <i id="icon-eye-open" class="bi bi-eye hidden"></i>
                        </button>
                    </div>

                    <p id="password-error" class="form-error"></p>
                </div>

                {% if error_login %}
                    <p class="login-error">{{ error_login }}</p>
                {% endif %}

                <button type="submit" class="login-button">
                    Iniciar sesión
                </button>

            </form>

        </section>

    </main>

    <script src="{% static 'js/compartido/login.js' %}"></script>
</body>
</html>
